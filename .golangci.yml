version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    misspell:
      ignore-rules:
        - comando
        - comandos
        - argumentos
        - conflictos
        - dependencias
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
